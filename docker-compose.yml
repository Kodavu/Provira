# Local dev stack: Postgres + Redis + the Provira API. Everything runs with the
# mock integration adapters, so NO real API keys are needed.
#
#   docker compose up
#
# The API waits for Postgres, applies migrations, seeds demo data, then serves
# on http://localhost:4000/api.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: provira
      POSTGRES_PASSWORD: provira
      POSTGRES_DB: provira
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provira"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://provira:provira@postgres:5432/provira?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      JWT_SECRET: dev-only-change-me
      PAYMENTS_PROVIDER: mock
      SMS_PROVIDER: mock
      WHATSAPP_PROVIDER: mock
      LLM_PROVIDER: mock
    ports:
      - "4000:4000"
    command: >
      sh -c "pnpm --filter './packages/*' build &&
             pnpm --filter @provira/db push &&
             pnpm --filter @provira/db harden &&
             pnpm --filter @provira/db seed &&
             pnpm --filter @provira/api dev"

volumes:
  pgdata:
