name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# One in-flight run per branch/PR — a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the root package.json "packageManager" field.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma Client is a build input for @tally/db and everything downstream.
      # `prisma generate` needs no database, so CI stays DB-free.
      - name: Generate Prisma Client
        run: pnpm --filter @tally/db exec prisma generate

      # Turborepo orders each task by its dependency graph (^build first) and
      # caches unchanged packages, so these stay fast on incremental pushes.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
